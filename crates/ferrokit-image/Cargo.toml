[package]
name = "ferrokit-image"
description = "Ferrokit image engine: decode, transform and encode images"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "qoi", "tga", "pnm", "rayon"] }
fast_image_resize = { version = "6", features = ["image", "rayon"] }
jpeg-encoder = "0.7"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
webp = { version = "0.3", default-features = false }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rgb = "0.8"
kamadak-exif = "0.6"
img-parts = "0.4"
color_quant = "1.1"
gif = "0.14"
vtracer = "0.6"
visioncortex = "0.8"
rayon = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
