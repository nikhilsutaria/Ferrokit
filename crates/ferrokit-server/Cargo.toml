[package]
name = "ferrokit-server"
description = "Ferrokit web server: serves the UI and the tool API"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ferrokit"
path = "src/main.rs"

[dependencies]
ferrokit-pdf = { path = "../ferrokit-pdf" }
ferrokit-sign = { path = "../ferrokit-sign" }
ferrokit-image = { path = "../ferrokit-image" }
ferrokit-http = { path = "../ferrokit-http", features = ["pdf", "image", "sign"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
rust-embed = "8"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
mime_guess = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
