[workspace]
resolver = "2"
members = ["crates/ferrokit-pdf", "crates/ferrokit-server", "crates/ferrokit-sign", "crates/ferrokit-image", "crates/ferrokit-http", "crates/ferrokit-worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
