# Ferrokit on your home network.
#   docker compose up -d --build
# then open http://<your-server>:8080 from any device on the LAN.
services:
  ferrokit:
    build: .
    image: ferrokit:latest
    container_name: ferrokit
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      FERROKIT_MAX_UPLOAD_MB: "1024"   # largest single request
      # FERROKIT_JOBS: "4"             # heavy jobs at once (default: CPU count)
      # FERROKIT_LOG: "info"           # debug for more detail
      # FERROKIT_OFFICE_URL: "http://ferrokit-office:8090"   # where the add-ons live (defaults shown)
      # FERROKIT_OCR_URL: "http://ferrokit-ocr:8090"
      # FERROKIT_MEDIA_URL: "http://ferrokit-media:8090"
      # FERROKIT_MEDIA_MAX_UPLOAD_MB: "10240"   # largest video upload (media add-on only)
    # Uploads and scratch files live in RAM and vanish on restart.
    tmpfs:
      - /tmp:size=2g
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [default, media-internal]

  # Optional add-ons. Switch them on with profiles, e.g.
  #   docker compose --profile office --profile ocr up -d
  # or put COMPOSE_PROFILES=office,ocr in a .env file next to this one.
  # They talk to Ferrokit over Docker's private network; no ports are opened on your LAN.

  # Office: Word/Excel/PowerPoint <-> PDF, web page / Markdown / EPUB -> PDF, PDF/A.
  ferrokit-office:
    profiles: [office]
    build:
      context: .
      dockerfile: addons/office/Dockerfile
    image: ferrokit-office:latest
    container_name: ferrokit-office
    restart: unless-stopped
    environment:
      FERROKIT_OFFICE_WORKERS: "2"   # warm LibreOffice instances (~200 MB RAM each)
      FERROKIT_MAX_UPLOAD_MB: "1024"
    tmpfs:
      - /tmp:size=2g
    shm_size: 512m                  # Chromium needs a roomier /dev/shm
    read_only: true
    security_opt:
      - no-new-privileges:true

  # OCR: make scanned PDFs searchable and copy text out of images (every Tesseract language).
  # "Make PDF searchable" runs as a background job; results wait on ferrokit-ocr-jobs for 1 hour.
  ferrokit-ocr:
    profiles: [ocr]
    build:
      context: .
      dockerfile: addons/ocr/Dockerfile
    image: ferrokit-ocr:latest
    container_name: ferrokit-ocr
    restart: unless-stopped
    environment:
      FERROKIT_MAX_UPLOAD_MB: "1024"
      # FERROKIT_OCR_KEEP_MIN: "60"         # minutes a finished result is kept
      # FERROKIT_OCR_JOB_LIMIT_MIN: "180"   # longest one job may run
    volumes:
      - ferrokit-ocr-jobs:/jobs
    tmpfs:
      - /tmp:size=4g
    read_only: true
    security_opt:
      - no-new-privileges:true

  # Media: video and audio tools (ffmpeg), run as background jobs with a progress bar.
  # Results wait on the ferrokit-media-jobs volume for 1 hour, then are deleted.
  # It sits on an internal network shared only with Ferrokit, so it has no internet access.
  ferrokit-media:
    profiles: [media]
    build:
      context: .
      dockerfile: addons/media/Dockerfile
    image: ferrokit-media:latest
    container_name: ferrokit-media
    restart: unless-stopped
    environment:
      FERROKIT_MEDIA_MAX_UPLOAD_MB: "10240"   # largest upload (10 GB)
      # FERROKIT_MEDIA_VIDEO_JOBS: "1"        # video jobs at once (more just share the CPU)
      # FERROKIT_MEDIA_AUDIO_JOBS: "1"        # audio jobs at once, in their own queue
      # FERROKIT_MEDIA_KEEP_MIN: "60"         # minutes a finished result is kept
      # FERROKIT_MEDIA_JOB_LIMIT_MIN: "180"   # longest one job may run
    volumes:
      - ferrokit-media-jobs:/jobs
    tmpfs:
      - /tmp:size=512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks: [media-internal]

  # Later add-ons:
  # ai:     CPU models for background removal, upscaling and transcription

networks:
  default: {}
  # No route out: the media add-on can talk to Ferrokit and nothing else.
  media-internal:
    internal: true

volumes:
  ferrokit-media-jobs: {}
  ferrokit-ocr-jobs: {}
